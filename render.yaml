services:
  - type: web
    name: slotify
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: COOKIE_NAME
        value: slotify_token
      - key: CLIENT_URL
        sync: false
      - key: VITE_API_URL
        value: /api

